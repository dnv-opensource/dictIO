name: Merge into release

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  merge_into_release:
    name: Merge release commit into release branch
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Fetch the whole history to prevent unrelated history errors
          fetch-depth: 0
      - name: Create release source branch
        id: create_release_ref
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch_name="release-merge-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/heads/${branch_name}" \
            -f "sha=${GITHUB_SHA}" > /dev/null
          echo "head_ref=$branch_name" >> "$GITHUB_OUTPUT"

          resolved_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch_name}" \
            --jq '.object.sha')"
          if [[ "$resolved_sha" != "$GITHUB_SHA" ]]; then
            echo "Temporary release branch does not point to the release commit." >&2
            exit 1
          fi
      - uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          target_branch: release
          head_to_merge: ${{ steps.create_release_ref.outputs.head_ref }}
          github_token: ${{ secrets.RELEASE_TOKEN }}
      - name: Delete release source branch
        if: ${{ always() && steps.create_release_ref.outputs.head_ref != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HEAD_REF: ${{ steps.create_release_ref.outputs.head_ref }}
        run: |
          set -euo pipefail
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}"
