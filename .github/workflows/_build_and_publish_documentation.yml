name: Build and publish documentation

on:
  workflow_call:

env:
  DEFAULT_BRANCH_REF: "refs/heads/release"
  DEPLOY_REF: ${{ github.ref }}
  #SPHINXOPTS: '-W --keep-going -T'
  # ^-- If these SPHINXOPTS are enabled, then be strict about the builds and fail on any warnings

jobs:
  build-and-publish-docs:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install the project
        run: uv sync --frozen
      - name: Print debugging information
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "github.ref: $DEPLOY_REF"
          echo "github.event_name: $EVENT_NAME"
          echo "github.head_ref: $HEAD_REF"
          echo "github.base_ref: $BASE_REF"
          set -x
          git rev-parse --abbrev-ref HEAD
          git branch
          git branch -a
          git remote -v
          uv run python -V
          uv pip list

      # -------- Build documentation ------------------------- #
      - uses: sphinx-doc/github-problem-matcher@master
      - name: Build documentation
        run: |
          cd docs
          uv run make html

      - name: Clone and cleanup gh-pages branch
        run: |
          set -x
          git fetch
          ( git branch gh-pages remotes/origin/gh-pages && git clone . --branch=gh-pages _gh-pages/ ) || mkdir _gh-pages
          rm -rf _gh-pages/.git/
          mkdir -p _gh-pages/branch/

      # Delete orphaned branch-folders:
      # Go through each subfolder in _gh-pages/branch/
      # If it relates to an orphaned branch, delete it.
      - name: Delete orphaned branch-folders
        run: |
          set -x
          for branch_dir in _gh-pages/branch/*; do
              [[ -d "$branch_dir" ]] || continue
              brdir="${branch_dir##*/}"
              brname="${brdir//--/\/}"
              if ! git show-ref --verify --quiet "refs/remotes/origin/$brname"; then
                  echo "Removing $brdir"
                  rm -r -- "$branch_dir"
              fi
          done

      # Copy documentation to _gh-pages/  (if push happened on release branch)
      - name: Copy documentation to _gh-pages/
        if: github.ref == env.DEFAULT_BRANCH_REF
        run: |
          set -x
          # Delete everything under _gh-pages/ that is from the
          # primary branch deployment.  Excludes the other branches
          # _gh-pages/branch-* paths, and not including
          # _gh-pages itself.
          find _gh-pages/ -mindepth 1 ! -path '_gh-pages/branch*' -delete
          rsync -a docs/build/html/ _gh-pages/

      # Copy documentation to _gh-pages/branch/$brname  (if push happened on any other branch)
      # ('/' gets replaced by '--')
      - name: Copy documentation to branch-specific directory
        if: github.ref != env.DEFAULT_BRANCH_REF
        run: |
          set -x
          brname="$DEPLOY_REF"
          brname="${brname##refs/heads/}"
          brname="${brname##refs/tags/}"
          brdir="${brname//\//--}"
          rm -rf -- "_gh-pages/branch/$brdir"
          rsync -a docs/build/html/ "_gh-pages/branch/$brdir/"

      # Add .nojekyll file
      - name: Add .nojekyll file
        run: touch _gh-pages/.nojekyll

      # Publish: Commit gh-pages branch and publish it to GitHub Pages
      - name: Publish documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _gh-pages/
          force_orphan: true
